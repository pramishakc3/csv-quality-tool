[project]
name = "csv-quality-tool"
version = "0.1.0"
description = "A CLI tool for profiling and cleaning messy CSV data."
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
csv-quality-tool = "csv_quality_tool.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csv_quality_tool*"]
